<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Aerial · Channels</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --label: #000; --secondary: rgba(60,60,67,.62);
    --sep: rgba(60,60,67,.16); --tint: #007aff; --fill: rgba(118,118,128,.12);
    --danger: #ff3b30; --ok: #34c759; --warn: #ff9f0a; --scrim: rgba(0,0,0,.36);
    --bar: rgba(249,249,249,.86); --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.62);
      --sep: rgba(84,84,88,.5); --tint: #0a84ff; --fill: rgba(118,118,128,.24);
      --danger: #ff453a; --ok: #30d158; --warn: #ffd60a; --scrim: rgba(0,0,0,.55);
      --bar: rgba(22,22,22,.86);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .top {
    position: sticky; top: 0; z-index: 10; background: var(--bar);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep); padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  }
  .topin { max-width: 1120px; margin: 0 auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .brand { flex: 1; min-width: 180px; }
  .brand h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--secondary); }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 10px; background: var(--fill); color: var(--label);
    min-height: 36px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; transition: transform .12s ease, background .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--tint); color: #fff; }
  .btn.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .btn.small { min-height: 30px; padding: 4px 9px; font-size: 14px; border-radius: 8px; }
  .btn.icon { min-width: 32px; justify-content: center; padding: 4px 8px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .btn.link { background: none; color: var(--tint); padding: 4px 6px; }
  .lang { border: 1px solid var(--sep); background: var(--card); border-radius: 9px; min-height: 36px; padding: 4px 8px; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 16px calc(48px + env(safe-area-inset-bottom)); }
  .hint { color: var(--secondary); font-size: 13px; margin: 0 4px 14px; }
  #channels { display: grid; gap: 12px; }
  @media (min-width: 900px) { #channels { grid-template-columns: 1fr 1fr; align-items: start; } }
  .card {
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    border: 1px solid transparent; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card.current { border-color: color-mix(in srgb, var(--tint) 45%, transparent); }
  .card.off { opacity: .72; }
  .chead { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; }
  .cname { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
  .cname b { display: block; font-size: 17px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cname span { display: block; color: var(--secondary); font-size: 12px; margin-top: 2px; }
  .badges { display: flex; gap: 6px; padding: 0 14px 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; border-radius: 999px; padding: 2px 7px; background: var(--fill); color: var(--secondary); white-space: nowrap; }
  .tag.current { background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); }
  .tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .tag.bad { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .cactions { display: flex; gap: 4px; padding: 2px 10px 10px; flex-wrap: wrap; align-items: center; }
  .switch {
    appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0;
    width: 46px; height: 28px; margin: 0; border-radius: 999px; background: var(--fill);
    transition: background .2s ease; cursor: pointer;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .22s cubic-bezier(.23,1,.32,1);
  }
  .switch:checked { background: var(--ok); }
  .switch:checked::after { transform: translateX(18px); }
  .sources { border-top: .5px solid var(--sep); padding: 4px 12px 10px; background: color-mix(in srgb, var(--fill) 28%, transparent); }
  .src { display: flex; gap: 10px; padding: 9px 2px; border-top: .5px solid var(--sep); align-items: flex-start; }
  .src:first-child { border-top: 0; }
  .src.off { opacity: .62; }
  .srcinfo { flex: 1; min-width: 0; }
  .srcinfo .slabel { font-size: 12px; color: var(--secondary); }
  .srcinfo .surl { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .speed { font-size: 12px; margin-top: 3px; color: var(--secondary); }
  .speed.good { color: var(--ok); } .speed.slow { color: var(--warn); } .speed.bad { color: var(--danger); }
  .srcside { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .srcacts { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
  .empty { text-align: center; color: var(--secondary); padding: 70px 20px; }
  .empty b { display: block; color: var(--label); font-size: 19px; margin-bottom: 6px; }
  .progress { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: var(--tint); transform-origin: 0 50%; animation: pulse 1.1s ease-in-out infinite; z-index: 30; }
  @keyframes pulse { 0% { transform: scaleX(.05); opacity: .5; } 50% { transform: scaleX(.6); opacity: 1; } 100% { transform: scaleX(1); opacity: .3; } }
  .sheet { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .sheet.on { opacity: 1; pointer-events: auto; }
  .sheetbox {
    width: 100%; max-width: 620px; max-height: 90vh; overflow: auto; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(18px); transition: transform .25s cubic-bezier(.23,1,.32,1);
  }
  @media (min-width: 700px) { .sheet { align-items: center; } .sheetbox { border-radius: 20px; } }
  .sheet.on .sheetbox { transform: none; }
  .sheethead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sheethead h2 { flex: 1; margin: 0; font-size: 20px; }
  .shell { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--secondary); }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--sep); background: var(--bg); border-radius: 10px;
    padding: 10px 11px; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--tint); }
  .field textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .note { font-size: 13px; color: var(--secondary); }
  .note.warn { color: var(--warn); }
  .sheetacts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .pv { display: flex; flex-direction: column; gap: 2px; max-height: 38vh; overflow: auto; border: 1px solid var(--sep); border-radius: 10px; }
  .pvitem { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border-top: .5px solid var(--sep); }
  .pvitem:first-child { border-top: 0; }
  .pvitem input { margin-top: 3px; }
  .pvitem div { min-width: 0; flex: 1; }
  .pvitem b { font-size: 14px; font-weight: 600; }
  .pvitem .tag { margin-left: 5px; }
  .pvitem .surl { font-size: 12px; color: var(--secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px);
    background: rgba(28,28,30,.94); color: #fff; border-radius: 999px; padding: 9px 16px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 50; max-width: 88vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-color-scheme: dark) { #toast { background: rgba(240,240,245,.94); color: #000; } }
</style>
</head>
<body>
<div id="progress" class="progress" hidden></div>
<header class="top">
  <div class="topin">
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="tools">
      <button id="add" class="btn primary"><span>+</span><span data-i18n="add_channel"></span></button>
      <button id="import" class="btn"><span data-i18n="import"></span></button>
      <button id="json" class="btn"><span data-i18n="import_json"></span></button>
      <button id="exjson" class="btn"><span>JSON</span> <span class="note" data-i18n="export"></span></button>
      <button id="exm3u" class="btn"><span>M3U</span> <span class="note" data-i18n="export"></span></button>
      <select id="lang" class="lang" aria-label="Language"></select>
    </div>
  </div>
</header>
<main>
  <p id="hint" class="hint"></p>
  <div id="channels"></div>
  <div id="empty" class="empty" hidden><b data-i18n="no_channels"></b><span data-i18n="empty_hint"></span></div>
</main>
<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheetbox" role="dialog" aria-modal="true">
    <div class="sheethead"><h2 id="sheettitle"></h2><button class="btn icon" id="sheetclose" aria-label="Close">×</button></div>
    <div id="sheetbody"></div>
    <div id="sheetacts" class="sheetacts"></div>
  </div>
</div>
<div id="toast"></div>

const LANGS = Object.keys(TEXTS);

}

const ERR = {

  'bad json':'err_json', 'no entries':'err_playlist', 'bad url':'err_url', 'missing name':'err_name',

  'nothing to test':'err_empty', 'no sources':'err_empty', 'bad source':'err_playlist'

}

}

  catch (e) { toast(errText(e.message)); }

}

function testKey(ci, si) { return ci + ':' + si; }

  });
  sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false');
  const first = $('#sheetbody input, #sheetbody select, #sheetbody textarea');
  if (first) setTimeout(() => first.focus(), 60);
}
function field(id, label, value, ph, type) {
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || '') + '"></div>';
}
function textField(id, label, value, ph) {
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><textarea id="' + id + '" placeholder="' + esc(ph || '') + '">' + esc(value || '') + '</textarea></div>';
}

$('#add').onclick = () => {
  openSheet(t('add_channel'),
    field('aname', t('name'), '', t('name_ph')) +
    field('aurl', t('first_url'), '', t('url_ph'), 'url') +
    field('alabel', t('label'), '', t('label_ph')),
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('save'), kind: 'primary', fn: async () => {
          const name = $('#aname').value.trim(), url = $('#aurl').value.trim(), label = $('#alabel').value.trim();
          if (!name) return toast(t('no_name'));
          if (!url) return toast(t('no_url'));
          const r = await act(() => post('api/channel/add', { name, url, label }));
          if (r) closeSheet();
        } }
    ]);
};
function renameSheet(ci) {
  const ch = state.channels[ci];
  openSheet(t('rename'), field('rname', t('name'), ch.name, t('name_ph')),
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('save'), kind: 'primary', fn: async () => {
          const name = $('#rname').value.trim();
          if (!name) return toast(t('no_name'));
          const r = await act(() => post('api/channel/rename', { index: ci, name }));
          if (r) closeSheet();
        } }
    ]);
}
function deleteChannelSheet(ci) {
  const ch = state.channels[ci];
  openSheet(t('delete_channel'),
    '<p class="note">' + esc(t('delete_channel_q', { name: ch.name })) + '</p><p class="note">' + esc(t('delete_channel_hint')) + '</p>',
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('delete'), kind: 'danger', fn: async () => {
          const r = await act(() => post('api/channel/delete', { index: ci, confirm: '1' }));
          if (r) closeSheet();
        } }
    ]);
}
function deleteSourceSheet(ci, si) {
  const s = state.channels[ci].sources[si];
  openSheet(t('delete_source'),
    '<p class="note">' + esc(t('delete_source_q')) + '</p><div class="note">' + esc(s.url) + '</div><p class="note">' + esc(t('delete_source_hint')) + '</p>',
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('delete'), kind: 'danger', fn: async () => {
          const r = await act(() => post('api/source/delete', { channel: ci, index: si, confirm: '1' }));
          if (r) closeSheet();
        } }

}
function poolOptions() {
  return '<option value="">' + esc(t('pick_pool')) + '</option>' + state.pool.map((s, i) =>
    '<option value="' + i + '">' + esc((s.label || t('manual')) + ' · ' + s.url) + '</option>').join('');
}
function sourceSheet(ci) {
  openSheet(t('add_source'),
    '<div class="field"><label for="spool">' + esc(t('source_pool')) + '</label><select id="spool">' + poolOptions() + '</select></div>' +
    field('surl', t('url'), '', t('url_ph'), 'url') +
    field('slabel', t('label'), '', t('label_ph')),
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('save'), kind: 'primary', fn: async () => {
          const url = $('#surl').value.trim(), label = $('#slabel').value.trim();
          if (!url) return toast(t('no_url'));
          const r = await act(() => post('api/source/add', { channel: ci, url, label }));
          if (r) closeSheet();
        } }
    ]);
  $('#spool').onchange = e => {
    const s = state.pool[+e.target.value];
    if (s) { $('#surl').value = s.url; $('#slabel').value = s.label || ''; }

}

function importSheet() {
  openSheet(t('import_title'),
    '<div class="field"><label for="ifile">' + esc(t('import_file')) + '</label><input id="ifile" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain"></div>' +
    '<div class="note">' + esc(t('file_hint')) + '</div>' +
    '<div class="field"><label for="iurl">' + esc(t('import_url')) + '</label><input id="iurl" type="url" placeholder="' + esc(t('import_url_ph')) + '"></div>' +
    textField('itext', t('import_paste'), '', t('paste_ph')) +
    '<div id="pvwrap"></div>',
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('preview'), fn: () => previewImport() },
      { label: t('apply_import'), kind: 'primary', fn: () => applyImport(), disabled: true }
    ]);
}
async function previewImport() {
  const file = $('#ifile').files[0];
  const url = $('#iurl').value.trim();
  const text = $('#itext').value;
  busy(true);
  try {
    let res;
    if (file) {
      if (file.size > 5 * 1024 * 1024) throw new Error('too large');
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch(base + 'api/import/preview', { method: 'POST', body: fd });
      res = await r.json();
      if (!r.ok) throw new Error(res.error || ('HTTP ' + r.status));
    } else if (url) {
      res = await post('api/import/preview', { url });
    } else if (text.trim()) {
      res = await post('api/import/preview', { text, name: 'playlist.m3u' });
    } else {
      throw new Error('no playlist');
    }
    const wrap = $('#pvwrap');
    wrap.innerHTML = '<div class="note">' + esc(res.label) + '</div>' +
      '<div class="pv" id="pv">' + res.items.map((it, i) =>
        '<label class="pvitem"><input type="checkbox" data-i="' + i + '"' + (it.duplicate ? '' : ' checked') + '>' +
        '<div><b>' + esc(it.name) + '</b>' +
        (it.duplicate ? '<span class="tag">' + t('duplicate') + '</span>' :
          it.target ? '<span class="tag">' + esc(t('merge_into', { name: it.target })) + '</span>' :
          '<span class="tag ok">' + t('new_channel') + '</span>') +
        '<div class="surl" title="' + esc(it.url) + '">' + esc(it.url) + '</div></div></label>').join('') + '</div>' +
      '<div class="cactions"><button class="btn small" id="pv_all">' + t('select_all') + '</button>' +
      '<button class="btn small" id="pv_none">' + t('select_none') + '</button></div>';
    $('#pv_all').onclick = () => document.querySelectorAll('#pv input').forEach(x => x.checked = true);
    $('#pv_none').onclick = () => document.querySelectorAll('#pv input').forEach(x => x.checked = false);
    const applyBtn = [...document.querySelectorAll('#sheetacts .btn')].find(b => b.textContent === t('apply_import'));
    if (applyBtn) applyBtn.disabled = false;
    previewImport.id = res.id;
  } catch (e) {
    toast(errText(e.message));
  } finally { busy(false); }
}
async function applyImport() {
  if (!previewImport.id) return toast(t('err_empty'));
  const selected = [...document.querySelectorAll('#pv input:checked')].map(x => +x.dataset.i);
  if (!selected.length) return toast(t('err_none'));
  const r = await act(() => post('api/import/apply', { id: previewImport.id, selected: selected.join(',') }));
  if (r) {
    closeSheet();
    toast(t('imported', { c: r.addedChannels || 0, s: r.addedSources || 0 }));
  }
}
$('#import').onclick = importSheet;

function jsonSheet() {
  openSheet(t('import_json'),
    '<p class="note warn">' + esc(t('overwrite_warn')) + '</p><p class="note">' + esc(t('import_json_hint')) + '</p>' +
    '<div class="field"><label for="jfile">' + esc(t('file')) + '</label><input id="jfile" type="file" accept=".json,application/json"></div>' +
    '<div class="field"><label for="jurl">' + esc(t('from_url')) + '</label><input id="jurl" type="url" placeholder="' + esc(t('json_url_ph')) + '"></div>',
    [
      { label: t('cancel'), fn: closeSheet },
      { label: t('overwrite'), kind: 'danger', fn: async () => {
          const file = $('#jfile').files[0], url = $('#jurl').value.trim();
          if (!file && !url) return toast(t('err_empty'));
          busy(true);
          try {
            let res;
            if (file) {
              if (file.size > 5 * 1024 * 1024) throw new Error('too large');
              const fd = new FormData(); fd.append('file', file);
              const r = await fetch(base + 'api/import/json?confirm=1', { method: 'POST', body: fd });
              res = await r.json();
              if (!r.ok) throw new Error(res.error || ('HTTP ' + r.status));
            } else {
              res = await post('api/import/json?confirm=1', { url });
            }
            state = res; closeSheet(); render(); toast(t('json_imported'));
          } catch (e) { toast(errText(e.message)); }
          finally { busy(false); }
        } }
    ]);
}
$('#json').onclick = jsonSheet;
$('#exjson').onclick = () => { location.href = base + 'api/export/json'; };
$('#exm3u').onclick = () => { location.href = base + 'api/export/m3u'; };

async function runTest(body) {
  if (testJob) return toast(t('err_running'));
  busy(true);
  try {
    const res = await post('api/test/start', body);
    testJob = { id: res.id, total: res.total, done: 0 };
    pollTest();
  } catch (e) { toast(errText(e.message)); }
  finally { busy(false); }
}
async function pollTest() {
  try {
    const s = await get('api/test/status?id=' + encodeURIComponent(testJob.id));
    testJob.total = s.total; testJob.done = s.done;
    s.items.forEach(it => {
      const key = testKey(it.channel, it.source);
      tests.set(key, it.done ? it : { pending: true });
    });
    render();
    if (!s.finished) setTimeout(pollTest, 750);
    else { testJob = null; render(); toast(t('test_done')); }
  } catch (e) {
    testJob = null; toast(errText(e.message)); render();
  }
}

applyStatic();
reload();
</script>
